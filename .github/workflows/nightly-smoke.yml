name: Nightly Smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: Start the live Gemini smoke suite now
        required: true
        type: choice
        options:
          - now

jobs:
  smoke:
    name: Gemini smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke suite
        run: |
          pnpm exec tsx scripts/smoke/run-smoke.ts \
            --config config/gemini.jsonc \
            --retries 3
