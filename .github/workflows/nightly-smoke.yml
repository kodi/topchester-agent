name: Nightly Smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: Start the live Gemini smoke suite now
        required: true
        type: choice
        options:
          - now

jobs:
  smoke:
    name: Gemini smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VITE_GIT_HOOKS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run smoke suite
        run: |
          mise exec -- vp run smoke \
            --config config/gemini.jsonc \
            --retries 3
