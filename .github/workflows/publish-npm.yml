name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Bump version and publish
    runs-on: ubuntu-latest
    env:
      VITE_GIT_HOOKS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main
          git pull --ff-only origin main

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run static checks
        run: vp check

      - name: Run tests
        run: vp test run --dir test

      - name: Build package
        run: vp run build

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        run: pnpm version ${{ inputs.release }} --no-git-tag-version

      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: release topchester-ai v${{ steps.package.outputs.version }}"
          git tag "v${{ steps.package.outputs.version }}"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Push version bump and tag
        run: git push origin main --follow-tags
