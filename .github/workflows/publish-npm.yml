name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  verify-native:
    name: Native release preflight (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      VITE_GIT_HOOKS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install PTY test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check isolated native npm package
        run: mise run package-check

      - name: Check native npm PTY lifecycle
        run: mise run opentui-pty-smoke

  publish:
    name: Bump version and publish
    needs: verify-native
    runs-on: ubuntu-latest
    env:
      VITE_GIT_HOOKS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main
          git pull --ff-only origin main

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install PTY test dependency
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release checks
        run: mise run local-ci-extended

      - name: Bump package version
        run: npm version ${{ inputs.release }} --no-git-tag-version

      - name: Build standalone npm release packages
        run: mise run release-build

      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: release topchester-ai v${{ steps.package.outputs.version }}"
          git tag "v${{ steps.package.outputs.version }}"

      - name: Set up npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The existing topchester-ai trusted publisher supplies OIDC authentication.
      # Platform binaries use tagged versions of that same package identity.
      - name: Publish native versions and npm launcher
        run: vp run release:publish

      - name: Push version bump and tag
        run: git push origin main "v${{ steps.package.outputs.version }}"
