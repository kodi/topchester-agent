name: Code Quality

on:
  push:
  pull_request:

jobs:
  code-quality:
    name: Check code quality
    runs-on: ubuntu-latest
    env:
      VITE_GIT_HOOKS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: vp check
