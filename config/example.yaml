models:
  defaultPurpose: agent.primary
  assignments:
    agent.primary: openrouter/qwen/qwen3-coder:free
    agent.fast: openrouter/qwen/qwen3-coder:free
    kb.scan: openrouter/qwen/qwen3-coder:free
    kb.summarize: openrouter/qwen/qwen3-coder:free
    kb.extract: openrouter/qwen/qwen3-coder:free
    kb.embed: openrouter/qwen/qwen3-coder:free
    fallback: openrouter/qwen/qwen3-coder:free
  providers:
    openrouter:
      type: openai-compatible
      baseURL: https://openrouter.ai/api/v1
      apiKeyEnv: OPENROUTER_API_KEY
      supportsStructuredOutputs: true
      headers:
        HTTP-Referer: https://topchester.dev
        X-Title: Topchester
